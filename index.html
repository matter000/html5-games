<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="游戏乐园 — 经典小游戏合集，在线即玩">
  <meta name="theme-color" content="#07091a">
  <title>游戏乐园</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrapper">

    <!-- Header -->
    <header class="site-header">
      <div class="container">
        <h1 class="site-title">游戏乐园</h1>
        <p class="site-subtitle">六款经典小游戏，随时随地开启欢乐时光</p>
        <div class="header-divider" aria-hidden="true"></div>
      </div>
    </header>

    <!-- Games Grid -->
    <main class="games-section">
      <div class="container">
        <div class="games-grid">

          <a href="games/snake.html" target="_self" class="game-card" data-game="snake">
            <span class="game-card__icon" aria-hidden="true">🐍</span>
            <div class="game-card__text">
              <h2 class="game-card__title">贪吃蛇</h2>
              <p class="game-card__desc">经典贪吃蛇，吃食物变长，速度越来越快</p>
            </div>
          </a>

          <a href="games/tetris.html" target="_self" class="game-card" data-game="tetris">
            <span class="game-card__icon" aria-hidden="true">🧱</span>
            <div class="game-card__text">
              <h2 class="game-card__title">俄罗斯方块</h2>
              <p class="game-card__desc">旋转下落的方块，消除整行得分</p>
            </div>
          </a>

          <a href="games/minesweeper.html" target="_self" class="game-card" data-game="minesweeper">
            <span class="game-card__icon" aria-hidden="true">💣</span>
            <div class="game-card__text">
              <h2 class="game-card__title">扫雷</h2>
              <p class="game-card__desc">根据数字提示，找出所有隐藏的地雷</p>
            </div>
          </a>

          <a href="games/2048.html" target="_self" class="game-card" data-game="2048">
            <span class="game-card__icon" aria-hidden="true">🔢</span>
            <div class="game-card__text">
              <h2 class="game-card__title">2048</h2>
              <p class="game-card__desc">滑动合并数字，挑战达到 2048</p>
            </div>
          </a>

          <a href="games/memory.html" target="_self" class="game-card" data-game="memory">
            <span class="game-card__icon" aria-hidden="true">🃏</span>
            <div class="game-card__text">
              <h2 class="game-card__title">记忆翻牌</h2>
              <p class="game-card__desc">翻开卡牌找到配对，考验你的记忆力</p>
            </div>
          </a>

          <a href="games/gomoku.html" target="_self" class="game-card" data-game="gomoku">
            <span class="game-card__icon" aria-hidden="true">⚫</span>
            <div class="game-card__text">
              <h2 class="game-card__title">五子棋</h2>
              <p class="game-card__desc">先连成五子者胜，经典策略对弈</p>
            </div>
          </a>

        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <p>游戏乐园 &copy; 2026 — 纯前端实现，无需联网，打开即玩</p>
      </div>
    </footer>

  </div>
</body>
</html>
