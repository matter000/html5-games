<!DOCTYPE html>
<html lang="zh-CN" data-theme="aurora">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="游戏乐园 — 十一款经典小游戏合集，在线即玩，支持四套主题自由切换">
    <meta name="theme-color" content="#6366f1">
    <title>游戏乐园</title>
    <style id="theme-vars">
/* ============================================================
   游戏乐园 · 多主题设计系统
   四套主题：极光(aurora) / 午夜(midnight) / 街机(arcade) / 墨白(mono)
   默认 :root = aurora；其余主题通过 [data-theme] 覆盖语义变量
   ============================================================ */

/* --- Theme: Aurora（极光 · 默认浅色现代） --- */
:root {
  --background: #f5f7fc;
  --foreground: #10172a;
  --card: #ffffff;
  --card-foreground: #10172a;
  --popover: #ffffff;
  --popover-foreground: #10172a;
  --primary: #6366f1;
  --primary-foreground: #ffffff;
  --muted: #eaeefb;
  --muted-foreground: #69728f;
  --border: #e2e7f2;
  --input: #e2e7f2;
  --ring: #6366f1;
  --secondary: #eef1fb;
  --secondary-foreground: #475084;
  --accent: #ec4899;
  --destructive: #ef4444;

  /* 主题签名色（非语义，用于渐变与装饰） */
  --brand-2: #22d3ee;
  --brand-3: #ec4899;
  --hero-from: #6366f1;
  --hero-via: #8b5cf6;
  --hero-to: #ec4899;

  /* 半径 */
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 30px;

  /* 阴影与质感 */
  --shadow-card: 0 14px 34px -16px rgba(28, 38, 74, 0.20);
  --shadow-card-hover: 0 26px 50px -18px rgba(99, 102, 241, 0.32);
  --ring-soft: rgba(99, 102, 241, 0.16);
  --grid-line: rgba(20, 30, 60, 0.05);
  --aurora-1: rgba(99, 102, 241, 0.10);
  --aurora-2: rgba(34, 211, 238, 0.08);
  --aurora-3: rgba(236, 72, 153, 0.06);
}

/* --- Theme: Midnight（午夜 · 精致暗色） --- */
[data-theme="midnight"] {
  --background: #0b0e1a;
  --foreground: #e9edf7;
  --card: #151a2c;
  --card-foreground: #e9edf7;
  --popover: #151a2c;
  --popover-foreground: #e9edf7;
  --primary: #818cf8;
  --primary-foreground: #0b0e1a;
  --muted: #1d2336;
  --muted-foreground: #8b94ae;
  --border: #272e44;
  --input: #272e44;
  --ring: #818cf8;
  --secondary: #1d2336;
  --secondary-foreground: #aab2cc;
  --accent: #c084fc;

  --brand-2: #38bdf8;
  --brand-3: #c084fc;
  --hero-from: #818cf8;
  --hero-via: #38bdf8;
  --hero-to: #c084fc;

  --shadow-card: 0 18px 42px -18px rgba(0, 0, 0, 0.65);
  --shadow-card-hover: 0 28px 56px -20px rgba(129, 140, 248, 0.40);
  --ring-soft: rgba(129, 140, 248, 0.20);
  --grid-line: rgba(255, 255, 255, 0.045);
  --aurora-1: rgba(129, 140, 248, 0.12);
  --aurora-2: rgba(56, 189, 248, 0.10);
  --aurora-3: rgba(192, 132, 252, 0.08);
}

/* --- Theme: Arcade（街机 · 复古霓虹） --- */
[data-theme="arcade"] {
  --background: #0a0613;
  --foreground: #f3e9ff;
  --card: #160d28;
  --card-foreground: #f3e9ff;
  --popover: #160d28;
  --popover-foreground: #f3e9ff;
  --primary: #ff2e9a;
  --primary-foreground: #0a0613;
  --muted: #221339;
  --muted-foreground: #a987e6;
  --border: #34214f;
  --input: #34214f;
  --ring: #ff2e9a;
  --secondary: #221339;
  --secondary-foreground: #c9a8ff;
  --accent: #00f0ff;

  --brand-2: #00f0ff;
  --brand-3: #ffe600;
  --hero-from: #ff2e9a;
  --hero-via: #b026ff;
  --hero-to: #00f0ff;

  --shadow-card: 0 18px 42px -16px rgba(255, 46, 154, 0.30);
  --shadow-card-hover: 0 28px 60px -18px rgba(255, 46, 154, 0.50);
  --ring-soft: rgba(255, 46, 154, 0.26);
  --grid-line: rgba(255, 46, 154, 0.07);
  --aurora-1: rgba(255, 46, 154, 0.12);
  --aurora-2: rgba(0, 240, 255, 0.10);
  --aurora-3: rgba(255, 230, 0, 0.06);
}

/* --- Theme: Mono（墨白 · 极简黑白） --- */
[data-theme="mono"] {
  --background: #ffffff;
  --foreground: #000000;
  --card: #ffffff;
  --card-foreground: #000000;
  --popover: #ffffff;
  --popover-foreground: #000000;
  --primary: #000000;
  --primary-foreground: #ffffff;
  --muted: #f2f2f2;
  --muted-foreground: #6a6a6a;
  --border: #000000;
  --input: #000000;
  --ring: #000000;
  --secondary: #f2f2f2;
  --secondary-foreground: #000000;
  --accent: #000000;

  --brand-2: #1a1a1a;
  --brand-3: #555555;
  --hero-from: #000000;
  --hero-via: #2a2a2a;
  --hero-to: #6a6a6a;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;

  --shadow-card: 0 12px 26px -16px rgba(0, 0, 0, 0.30);
  --shadow-card-hover: 0 22px 44px -18px rgba(0, 0, 0, 0.42);
  --ring-soft: rgba(0, 0, 0, 0.14);
  --grid-line: rgba(0, 0, 0, 0.06);
  --aurora-1: rgba(0, 0, 0, 0.03);
  --aurora-2: rgba(0, 0, 0, 0.02);
  --aurora-3: rgba(0, 0, 0, 0.015);
}

/* ============================================================
   Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  margin: 0;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  background: var(--background);
  color: var(--foreground);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background-color 0.45s cubic-bezier(0.16, 1, 0.3, 1),
              color 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}

/* 大气背景光晕（随主题变化） */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 55% at 18% 8%, var(--aurora-1) 0%, transparent 60%),
    radial-gradient(ellipse 55% 45% at 82% 78%, var(--aurora-2) 0%, transparent 60%),
    radial-gradient(ellipse 45% 40% at 50% 50%, var(--aurora-3) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
  transition: background 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

/* 细网格底纹 */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 46px 46px;
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
}

.gp-shell { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* 主题切换时的全局平滑过渡 */
.gp-shell, .gp-shell * {
  transition-property: background-color, border-color, color, box-shadow;
  transition-duration: 0.4s;
  transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
}

/* ============================================================
   Top Bar
   ============================================================ */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 26px 0 8px;
}

.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--foreground); }
.brand__mark {
  width: 42px; height: 42px; border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--hero-from), var(--hero-to));
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.15rem;
  box-shadow: var(--shadow-card);
}
.brand__name { font-size: 1.12rem; font-weight: 700; letter-spacing: 0.02em; }

/* 主题切换器 */
.theme-switch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.theme-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 13px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground);
  font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer;
  transition: transform 0.25s, border-color 0.25s, color 0.25s, background-color 0.25s, box-shadow 0.25s;
}
.theme-chip:hover { transform: translateY(-1px); color: var(--foreground); }
.theme-chip__dots { display: inline-flex; gap: 3px; }
.theme-chip__dots i { width: 9px; height: 9px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12); }
.theme-chip[aria-pressed="true"] {
  color: var(--foreground); border-color: transparent;
  background: var(--foreground);
}
.theme-chip[aria-pressed="true"] .theme-chip__label { color: var(--background); }
.theme-chip[aria-pressed="true"] .theme-chip__dots i { box-shadow: none; }

/* ============================================================
   Hero
   ============================================================ */
.hero { padding: 34px 0 26px; text-align: left; }
.hero__eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--primary); background: color-mix(in srgb, var(--primary) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--primary) 26%, transparent);
  padding: 6px 14px; border-radius: 999px; margin-bottom: 22px;
}
.hero__eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 10px var(--primary); }
.hero__title {
  font-size: clamp(2.6rem, 6vw, 4.6rem); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em;
  margin: 0 0 18px;
  background: linear-gradient(110deg, var(--hero-from) 0%, var(--hero-via) 48%, var(--hero-to) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  animation: gp-shimmer 7s ease-in-out infinite;
}
.hero__sub { font-size: clamp(1rem, 2.2vw, 1.18rem); color: var(--muted-foreground); max-width: 560px; margin: 0 0 26px; }

/* ============================================================
   Stats
   ============================================================ */
.stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
  padding: 22px; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-card); margin-bottom: 30px;
}
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat__num {
  font-size: clamp(1.6rem, 3.4vw, 2.3rem); font-weight: 800; line-height: 1; letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--hero-from), var(--hero-to));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
}
.stat__label { font-size: 0.8rem; color: var(--muted-foreground); font-weight: 500; letter-spacing: 0.04em; }

/* ============================================================
   Controls (search + filter)
   ============================================================ */
.controls { margin-bottom: 26px; }
.search { position: relative; max-width: 560px; margin: 0 auto 16px; }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); pointer-events: none; }
.search input {
  width: 100%; padding: 13px 16px 13px 44px; font-family: inherit; font-size: 0.95rem;
  color: var(--foreground); background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-md); outline: none;
  transition: border-color 0.25s, box-shadow 0.25s, background-color 0.4s;
}
.search input::placeholder { color: var(--muted-foreground); }
.search input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--ring-soft); }

.filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip {
  padding: 7px 15px; font-family: inherit; font-size: 0.84rem; font-weight: 600;
  color: var(--muted-foreground); background: var(--card); border: 1px solid var(--border);
  border-radius: 999px; cursor: pointer;
  transition: transform 0.25s, color 0.25s, background-color 0.25s, border-color 0.25s, box-shadow 0.25s;
}
.chip:hover { color: var(--foreground); transform: translateY(-1px); }
.chip[aria-pressed="true"] {
  color: var(--primary-foreground); background: var(--primary); border-color: transparent;
  box-shadow: 0 6px 16px -4px var(--ring-soft);
}

/* ============================================================
   Section heading
   ============================================================ */
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 18px; }
.section-title { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.01em; margin: 0; position: relative; padding-left: 14px; }
.section-title::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 4px; height: 1.1em; border-radius: 2px;
  background: linear-gradient(180deg, var(--hero-from), var(--hero-to));
}
.section-hint { font-size: 0.82rem; color: var(--muted-foreground); }

/* ============================================================
   Recent rail
   ============================================================ */
.recent { margin-bottom: 30px; }
.recent-rail {
  display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px;
  scroll-snap-type: x mandatory; scrollbar-width: thin;
}
.recent-rail::-webkit-scrollbar { height: 6px; }
.recent-rail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.recent-card {
  flex: 0 0 auto; display: flex; align-items: center; gap: 11px;
  padding: 11px 16px; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-md); text-decoration: none; color: var(--foreground);
  scroll-snap-align: start; transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
}
.recent-card:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow-card); }
.recent-card__icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 1.15rem; background: var(--muted); }
.recent-card__name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; }
.recent-card__time { font-size: 0.72rem; color: var(--muted-foreground); }

/* ============================================================
   Games grid
   ============================================================ */
.games { padding-bottom: 50px; }
.games-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
}
.game-card {
  display: flex; flex-direction: column; padding: 22px 20px 18px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  text-decoration: none; color: inherit; position: relative; overflow: hidden;
  box-shadow: var(--shadow-card); cursor: pointer; outline: none;
  animation: gp-rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, box-shadow 0.3s, background-color 0.4s;
}
.game-card::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--g1, var(--hero-from)), var(--g2, var(--hero-to)));
  opacity: 0; transition: opacity 0.3s;
}
.game-card:hover { transform: translateY(-6px); border-color: transparent; box-shadow: var(--shadow-card-hover); }
.game-card:hover::after { opacity: 1; }
.game-card:focus-visible { box-shadow: var(--shadow-card-hover), 0 0 0 3px var(--ring-soft); }

.game-card__cat {
  position: absolute; top: 16px; right: 16px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em;
  color: var(--g1, var(--primary)); background: color-mix(in srgb, var(--g1, var(--primary)) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--g1, var(--primary)) 26%, transparent);
  padding: 3px 10px; border-radius: 999px;
}
.game-tile {
  width: 64px; height: 64px; border-radius: var(--radius-md); display: grid; place-items: center;
  font-size: 2rem; line-height: 1; margin: 8px 0 16px;
  background: linear-gradient(135deg, var(--g1, var(--hero-from)), var(--g2, var(--hero-to)));
  box-shadow: 0 10px 22px -10px var(--g1, var(--primary));
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s;
}
.game-card:hover .game-tile { transform: scale(1.08) rotate(-3deg); }
.game-card__title { font-size: 1.12rem; font-weight: 700; margin: 0 0 6px; }
.game-card__desc { font-size: 0.84rem; color: var(--muted-foreground); line-height: 1.55; margin: 0 0 14px; flex: 1; }
.game-card__foot { display: flex; flex-wrap: wrap; gap: 6px; }
.game-card__stat {
  font-size: 0.7rem; font-weight: 600; color: var(--muted-foreground);
  background: var(--muted); padding: 4px 9px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 4px;
}
.game-card__stat--hi { color: var(--g1, var(--primary)); }

/* per-game tile colors（保留各游戏个性） */
.game-card[data-game="snake"]       { --g1: #22c55e; --g2: #06b6d4; }
.game-card[data-game="tetris"]      { --g1: #3b82f6; --g2: #a855f7; }
.game-card[data-game="minesweeper"] { --g1: #f59e0b; --g2: #ef4444; }
.game-card[data-game="2048"]        { --g1: #f97316; --g2: #eab308; }
.game-card[data-game="memory"]      { --g1: #ec4899; --g2: #a855f7; }
.game-card[data-game="gomoku"]      { --g1: #06b6d4; --g2: #3b82f6; }
.game-card[data-game="tank"]        { --g1: #f5c518; --g2: #ef4444; }
.game-card[data-game="xiangqi"]     { --g1: #d4a23c; --g2: #8e1a1a; }
.game-card[data-game="breakout"]    { --g1: #06b6d4; --g2: #3b82f6; }
.game-card[data-game="sokoban"]     { --g1: #f59e0b; --g2: #eab308; }
.game-card[data-game="match3"]      { --g1: #ec4899; --g2: #a855f7; }

/* 墨白主题下，游戏色块去色以保持极简调性 */
[data-theme="mono"] .game-tile { filter: grayscale(1) contrast(1.05); }
[data-theme="mono"] .game-card__cat { color: var(--foreground); background: var(--muted); border-color: var(--border); }
[data-theme="mono"] .game-card__stat--hi { color: var(--foreground); }

/* 街机主题下，标题加一点霓虹辉光 */
[data-theme="arcade"] .hero__title { filter: drop-shadow(0 0 22px rgba(255, 46, 154, 0.35)); }
[data-theme="arcade"] .brand__mark { filter: drop-shadow(0 0 12px rgba(255, 46, 154, 0.5)); }

/* ============================================================
   Empty state
   ============================================================ */
.empty { text-align: center; padding: 70px 20px; color: var(--muted-foreground); display: none; }
.empty__emoji { font-size: 2.4rem; margin-bottom: 10px; }

/* ============================================================
   Footer
   ============================================================ */
.footer {
  border-top: 1px solid var(--border); padding: 26px 0; text-align: center;
  color: var(--muted-foreground); font-size: 0.84rem;
}

/* ============================================================
   Keyframes
   ============================================================ */
@keyframes gp-shimmer { 0%, 100% { background-position: 0% center; } 50% { background-position: 100% center; } }
@keyframes gp-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 1100px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 860px) {
  .games-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .topbar { flex-wrap: wrap; }
  .theme-switch { width: 100%; justify-content: flex-start; }
}
@media (max-width: 560px) {
  .games-grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, 1fr); padding: 16px; gap: 8px; }
  .gp-shell { padding: 0 18px; }
  .theme-chip__label { display: none; }
  .theme-chip { padding: 8px 10px; }
}
    </style>
</head>
<body>
    <div class="gp-shell">
      <!-- Top Bar -->
      <header class="topbar">
        <a class="brand" href="index.html">
          <span class="brand__mark">G</span>
          <span class="brand__name">游戏乐园</span>
        </a>
        <div class="theme-switch" role="group" aria-label="主题切换">
          <button class="theme-chip" data-theme-val="aurora" aria-pressed="true">
            <span class="theme-chip__dots"><i style="background:#6366f1"></i><i style="background:#22d3ee"></i><i style="background:#ec4899"></i></span>
            <span class="theme-chip__label">极光</span>
          </button>
          <button class="theme-chip" data-theme-val="midnight" aria-pressed="false">
            <span class="theme-chip__dots"><i style="background:#0b0e1a"></i><i style="background:#818cf8"></i><i style="background:#c084fc"></i></span>
            <span class="theme-chip__label">午夜</span>
          </button>
          <button class="theme-chip" data-theme-val="arcade" aria-pressed="false">
            <span class="theme-chip__dots"><i style="background:#ff2e9a"></i><i style="background:#00f0ff"></i><i style="background:#ffe600"></i></span>
            <span class="theme-chip__label">街机</span>
          </button>
          <button class="theme-chip" data-theme-val="mono" aria-pressed="false">
            <span class="theme-chip__dots"><i style="background:#000"></i><i style="background:#6a6a6a"></i><i style="background:#fff;box-shadow:inset 0 0 0 1px #ddd"></i></span>
            <span class="theme-chip__label">墨白</span>
          </button>
        </div>
      </header>

      <!-- Hero -->
      <section class="hero">
        <span class="hero__eyebrow">十一款经典游戏 · 纯前端实现</span>
        <h1 class="hero__title">游戏乐园</h1>
        <p class="hero__sub">贪吃蛇、俄罗斯方块、象棋、坦克大战……随时随地开启欢乐时光，支持四套主题自由切换。</p>
      </section>

      <!-- Stats -->
      <div class="stats">
        <div class="stat"><span class="stat__num" id="totalGames">0</span><span class="stat__label">款游戏</span></div>
        <div class="stat"><span class="stat__num" id="totalPlays">0</span><span class="stat__label">总游玩</span></div>
        <div class="stat"><span class="stat__num" id="totalCats">0</span><span class="stat__label">个分类</span></div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="搜索游戏名称、描述或分类…" autocomplete="off">
        </div>
        <div class="filters" id="filterTags"></div>
      </div>

      <!-- Recent -->
      <section class="recent" id="recentSection" style="display:none;">
        <div class="section-head">
          <h2 class="section-title">最近游玩</h2>
          <span class="section-hint">向右滑动查看更多</span>
        </div>
        <div class="recent-rail" id="recentRail"></div>
      </section>

      <!-- Games Grid -->
      <section class="games">
        <div class="section-head">
          <h2 class="section-title">全部游戏</h2>
          <span class="section-hint" id="gameCountHint">共 0 款</span>
        </div>
        <div class="games-grid" id="gamesGrid"></div>
        <div class="empty" id="noResults">
          <div class="empty__emoji">🔍</div>
          <p>未找到匹配的游戏</p>
        </div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <p>游戏乐园 &copy; 2026 — 十一款经典小游戏，纯前端实现，打开即玩</p>
      </footer>
    </div>

    <script src="js/game-stats.js"></script>
    <script>
      (function() {
        /* ---- 主题管理（四套主题自由切换） ---- */
        var THEME_KEY = 'gameParadise_theme_v2';
        var html = document.documentElement;
        var chips = document.querySelectorAll('.theme-chip');

        function getSavedTheme() {
          try { return localStorage.getItem(THEME_KEY) || 'aurora'; } catch(_) { return 'aurora'; }
        }
        function setTheme(theme) {
          html.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            var colorMap = { aurora: '#6366f1', midnight: '#818cf8', arcade: '#ff2e9a', mono: '#000000' };
            meta.setAttribute('content', colorMap[theme] || '#6366f1');
          }
          try { localStorage.setItem(THEME_KEY, theme); } catch(_) {}
          chips.forEach(function(c) {
            c.setAttribute('aria-pressed', c.dataset.themeVal === theme ? 'true' : 'false');
          });
        }
        setTheme(getSavedTheme());
        chips.forEach(function(chip) {
          chip.addEventListener('click', function() { setTheme(chip.dataset.themeVal); });
        });

        /* ---- 游戏卡片生成 ---- */
        var grid = document.getElementById('gamesGrid');
        var allGames = GameStats.getAllGameIds();

        allGames.forEach(function(id, i) {
          var meta = GameStats.getMeta(id);
          var stats = GameStats.getStats(id);
          var card = document.createElement('a');
          card.href = 'games/' + id + '.html';
          card.className = 'game-card';
          card.dataset.game = id;
          card.dataset.cat = meta.cat;
          card.style.animationDelay = (i * 60) + 'ms';

          var footHtml = '';
          if (stats.highScore > 0) footHtml += '<span class="game-card__stat game-card__stat--hi">最高 ' + stats.highScore + '</span>';
          if (stats.plays > 0) footHtml += '<span class="game-card__stat">' + stats.plays + ' 次游玩</span>';

          card.innerHTML =
            '<span class="game-card__cat">' + meta.cat + '</span>' +
            '<span class="game-tile">' + meta.icon + '</span>' +
            '<h3 class="game-card__title">' + meta.name + '</h3>' +
            '<p class="game-card__desc">' + meta.desc + '</p>' +
            '<div class="game-card__foot">' + footHtml + '</div>';
          grid.appendChild(card);
        });

        /* ---- 统计栏 ---- */
        document.getElementById('totalGames').textContent = allGames.length;
        document.getElementById('totalPlays').textContent = GameStats.getTotalPlays();
        var cats = GameStats.getCategories();
        document.getElementById('totalCats').textContent = cats.length;
        document.getElementById('gameCountHint').textContent = '共 ' + allGames.length + ' 款';

        /* ---- 分类标签 ---- */
        var filterTags = document.getElementById('filterTags');
        var allTag = document.createElement('button');
        allTag.className = 'chip';
        allTag.textContent = '全部';
        allTag.dataset.cat = '全部';
        allTag.setAttribute('aria-pressed', 'true');
        filterTags.appendChild(allTag);
        cats.forEach(function(cat) {
          var tag = document.createElement('button');
          tag.className = 'chip';
          tag.textContent = cat;
          tag.dataset.cat = cat;
          tag.setAttribute('aria-pressed', 'false');
          filterTags.appendChild(tag);
        });

        /* ---- 搜索与筛选 ---- */
        var searchInput = document.getElementById('searchInput');
        var noResults = document.getElementById('noResults');
        var activeCat = '全部';

        function applyFilter() {
          var query = searchInput.value.trim();
          var ids = query ? GameStats.search(query) : GameStats.getByCategory(activeCat);
          if (activeCat !== '全部' && query) {
            ids = ids.filter(function(id) { return GameStats.getMeta(id).cat === activeCat; });
          }
          var cards = grid.querySelectorAll('.game-card');
          var visible = 0;
          cards.forEach(function(card) {
            var show = ids.indexOf(card.dataset.game) !== -1;
            card.style.display = show ? '' : 'none';
            if (show) visible++;
          });
          noResults.style.display = visible > 0 ? 'none' : 'block';
        }

        searchInput.addEventListener('input', applyFilter);
        filterTags.addEventListener('click', function(e) {
          if (e.target.classList.contains('chip')) {
            filterTags.querySelectorAll('.chip').forEach(function(t) {
              t.setAttribute('aria-pressed', 'false');
            });
            e.target.setAttribute('aria-pressed', 'true');
            activeCat = e.target.dataset.cat;
            applyFilter();
          }
        });

        /* ---- 最近游玩 ---- */
        var recent = GameStats.getRecent(6);
        if (recent.length > 0) {
          document.getElementById('recentSection').style.display = '';
          var recentRail = document.getElementById('recentRail');
          recent.forEach(function(id) {
            var meta = GameStats.getMeta(id);
            var stats = GameStats.getStats(id);
            var card = document.createElement('a');
            card.href = 'games/' + id + '.html';
            card.className = 'recent-card';
            var timeAgo = '';
            if (stats.lastPlayed) {
              var diff = Date.now() - stats.lastPlayed;
              var mins = Math.floor(diff / 60000);
              if (mins < 1) timeAgo = '刚刚';
              else if (mins < 60) timeAgo = mins + ' 分钟前';
              else if (mins < 1440) timeAgo = Math.floor(mins / 60) + ' 小时前';
              else timeAgo = Math.floor(mins / 1440) + ' 天前';
            }
            card.innerHTML =
              '<span class="recent-card__icon">' + meta.icon + '</span>' +
              '<div><div class="recent-card__name">' + meta.name + '</div>' +
              (timeAgo ? '<div class="recent-card__time">' + timeAgo + '</div>' : '') + '</div>';
            recentRail.appendChild(card);
          });
        }
      })();
    </script>
</body>
</html>
