<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #0f1220;
  --bg-panel: #1a1f35;
  --bg-cell-hidden: #2a3050;
  --bg-cell-hidden-hover: #343b5c;
  --bg-cell-revealed: #13162a;
  --bg-cell-border-light: #3a4170;
  --bg-cell-border-dark: #0a0d18;
  --accent: #4a9eff;
  --accent-hover: #6bb3ff;
  --danger: #ff4757;
  --danger-bg: #5c1a1a;
  --success: #2ed573;
  --text-primary: #e8eaf0;
  --text-muted: #6b7280;
  --text-dim: #4a5068;
  --font-stack: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "Cascadia Code", "Fira Code", "Consolas", monospace;
  --cell-size: 36px;
  --gap: 2px;
  --radius: 4px;
  --transition: 120ms ease;
}

html { font-size: 16px; }

body {
  font-family: var(--font-stack);
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 40px;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
}

/* ─── Header ─── */
.header {
  width: 100%;
  max-width: 800px;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}

.back-link {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  transition: color var(--transition);
  white-space: nowrap;
}
.back-link:hover { color: var(--accent); }

.header h1 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text-primary);
}

/* ─── Controls ─── */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}

.diff-btn {
  background: var(--bg-panel);
  color: var(--text-muted);
  border: 1px solid var(--bg-cell-border-light);
  padding: 8px 20px;
  border-radius: var(--radius);
  font-family: var(--font-stack);
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition);
}
.diff-btn:hover {
  color: var(--text-primary);
  border-color: var(--accent);
}
.diff-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.flag-toggle {
  background: var(--bg-panel);
  color: var(--text-muted);
  border: 1px solid var(--bg-cell-border-light);
  padding: 8px 16px;
  border-radius: var(--radius);
  font-family: var(--font-stack);
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition);
  margin-left: 8px;
}
.flag-toggle.active {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}

/* ─── Status Bar ─── */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-panel);
  border: 1px solid var(--bg-cell-border-light);
  border-radius: var(--radius);
  padding: 8px 16px;
  margin-bottom: 16px;
  width: 100%;
  max-width: 600px;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--danger);
  min-width: 70px;
}
.status-item.timer {
  color: var(--accent);
  justify-content: flex-end;
}

.status-icon { font-size: 16px; }

.smiley-btn {
  background: none;
  border: 2px solid var(--bg-cell-border-light);
  border-radius: var(--radius);
  font-size: 28px;
  line-height: 1;
  padding: 4px 12px;
  cursor: pointer;
  transition: all var(--transition);
}
.smiley-btn:hover {
  border-color: var(--accent);
  transform: scale(1.05);
}
.smiley-btn:active { transform: scale(0.95); }

/* ─── Grid Container ─── */
.grid-wrapper {
  overflow-x: auto;
  max-width: 100%;
  padding: 4px;
  -webkit-overflow-scrolling: touch;
}

.grid {
  display: grid;
  gap: var(--gap);
  margin: 0 auto;
  width: fit-content;
}

/* ─── Cells ─── */
.cell {
  width: var(--cell-size);
  height: var(--cell-size);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
  border-radius: 3px;
  cursor: pointer;
  transition: background var(--transition), box-shadow var(--transition);
  position: relative;
}

.cell.hidden {
  background: var(--bg-cell-hidden);
  box-shadow:
    inset 1px 1px 0 var(--bg-cell-border-light),
    inset -1px -1px 0 var(--bg-cell-border-dark);
}
.cell.hidden:hover {
  background: var(--bg-cell-hidden-hover);
}
.cell.hidden:active {
  box-shadow: inset 0 0 0 var(--bg-cell-border-dark);
  background: var(--bg-cell-revealed);
}

.cell.revealed {
  background: var(--bg-cell-revealed);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
  cursor: default;
}

.cell.flagged::after {
  content: '🚩';
  font-size: 16px;
}

.cell.mine-hit {
  background: var(--danger-bg) !important;
}
.cell.mine-revealed::after {
  content: '💣';
  font-size: 15px;
}

/* Number colors */
.cell.n1 { color: #4a9eff; }
.cell.n2 { color: #2ed573; }
.cell.n3 { color: #ff4757; }
.cell.n4 { color: #7c5cfc; }
.cell.n5 { color: #cd6133; }
.cell.n6 { color: #00d2d3; }
.cell.n7 { color: #c8d6e5; }
.cell.n8 { color: #636e72; }

/* ─── Overlay ─── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 18, 32, 0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 300ms ease;
  backdrop-filter: blur(4px);
}
.overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.overlay-emoji {
  font-size: 64px;
  margin-bottom: 16px;
  animation: pop 400ms ease;
}
.overlay-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
}
.overlay-sub {
  font-size: 16px;
  color: var(--text-muted);
  margin-bottom: 24px;
}
.overlay-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 12px 32px;
  border-radius: var(--radius);
  font-family: var(--font-stack);
  font-size: 16px;
  cursor: pointer;
  transition: background var(--transition);
}
.overlay-btn:hover { background: var(--accent-hover); }

.best-record {
  color: var(--success);
  font-size: 14px;
  margin-top: 12px;
}

@keyframes pop {
  0% { transform: scale(0.3); opacity: 0; }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

/* ─── Responsive ─── */
@media (max-width: 600px) {
  :root { --cell-size: 30px; }
  .header h1 { font-size: 20px; }
  .status-bar { padding: 6px 12px; }
  .status-item { font-size: 17px; min-width: 56px; }
  .smiley-btn { font-size: 24px; padding: 2px 8px; }
  .diff-btn { padding: 6px 14px; font-size: 13px; }
}

@media (max-width: 400px) {
  :root { --cell-size: 26px; }
  body { padding: 12px 8px 32px; }
  .cell { font-size: 13px; }
  .cell.flagged::after { font-size: 13px; }
  .cell.mine-revealed::after { font-size: 12px; }
}
</style>
</head>
<body>

<div class="header">
  <a href="../index.html" class="back-link">← 返回首页</a>
  <h1>扫雷</h1>
</div>

<div class="controls">
  <button class="diff-btn active" data-level="beginner">初级</button>
  <button class="diff-btn" data-level="intermediate">中级</button>
  <button class="diff-btn" data-level="expert">高级</button>
  <button class="flag-toggle" id="flagToggle">🚩 插旗模式</button>
</div>

<div class="status-bar">
  <div class="status-item">
    <span class="status-icon">💣</span>
    <span id="mineCount">10</span>
  </div>
  <button class="smiley-btn" id="smileyBtn">😀</button>
  <div class="status-item timer">
    <span id="timerDisplay">0</span>
    <span class="status-icon">⏱</span>
  </div>
</div>

<div class="grid-wrapper">
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-emoji" id="overlayEmoji"></div>
  <div class="overlay-title" id="overlayTitle"></div>
  <div class="overlay-sub" id="overlaySub"></div>
  <button class="overlay-btn" id="overlayBtn">再来一局</button>
  <div class="best-record" id="bestRecord"></div>
</div>

<script src="../js/game-stats.js"></script>
<script>
(function() {
  'use strict';

  // ─── Config ───
  const LEVELS = {
    beginner:     { rows: 9,  cols: 9,  mines: 10, label: '初级' },
    intermediate: { rows: 16, cols: 16, mines: 40, label: '中级' },
    expert:       { rows: 16, cols: 30, mines: 99, label: '高级' }
  };

  // ─── State ───
  let currentLevel = 'beginner';
  let board = [];
  let rows, cols, totalMines;
  let minesPlaced = false;
  let gameOver = false;
  let gameWon = false;
  let flagCount = 0;
  let revealedCount = 0;
  let timerInterval = null;
  let seconds = 0;
  let flagMode = false;

  // ─── DOM refs ───
  const gridEl = document.getElementById('grid');
  const mineCountEl = document.getElementById('mineCount');
  const timerEl = document.getElementById('timerDisplay');
  const smileyBtn = document.getElementById('smileyBtn');
  const overlay = document.getElementById('overlay');
  const overlayEmoji = document.getElementById('overlayEmoji');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');
  const bestRecordEl = document.getElementById('bestRecord');
  const flagToggleBtn = document.getElementById('flagToggle');
  const diffBtns = document.querySelectorAll('.diff-btn');

  // ─── Init ───
  function init(level) {
    currentLevel = level || currentLevel;
    const cfg = LEVELS[currentLevel];
    rows = cfg.rows;
    cols = cfg.cols;
    totalMines = cfg.mines;

    board = [];
    minesPlaced = false;
    gameOver = false;
    gameWon = false;
    flagCount = 0;
    revealedCount = 0;
    seconds = 0;

    clearInterval(timerInterval);
    timerInterval = null;

    smileyBtn.textContent = '😀';
    mineCountEl.textContent = totalMines;
    timerEl.textContent = '0';
    overlay.classList.remove('visible');

    // Adjust cell size for expert
    const root = document.documentElement;
    if (currentLevel === 'expert') {
      root.style.setProperty('--cell-size', window.innerWidth < 600 ? '24px' : '28px');
    } else if (currentLevel === 'intermediate') {
      root.style.setProperty('--cell-size', window.innerWidth < 600 ? '30px' : '34px');
    } else {
      root.style.setProperty('--cell-size', '');
    }

    buildGrid();
  }

  function buildGrid() {
    gridEl.innerHTML = '';
    gridEl.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;

    for (let r = 0; r < rows; r++) {
      board[r] = [];
      for (let c = 0; c < cols; c++) {
        board[r][c] = {
          mine: false,
          revealed: false,
          flagged: false,
          adjacent: 0
        };

        const cell = document.createElement('div');
        cell.className = 'cell hidden';
        cell.dataset.r = r;
        cell.dataset.c = c;
        gridEl.appendChild(cell);
      }
    }
  }

  // ─── Mine Placement (first-click safe) ───
  function placeMines(safeR, safeC) {
    const forbidden = new Set();
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = safeR + dr;
        const nc = safeC + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          forbidden.add(nr * cols + nc);
        }
      }
    }

    let placed = 0;
    while (placed < totalMines) {
      const idx = Math.floor(Math.random() * rows * cols);
      if (forbidden.has(idx)) continue;
      const r = Math.floor(idx / cols);
      const c = idx % cols;
      if (board[r][c].mine) continue;
      board[r][c].mine = true;
      placed++;
    }

    // Calculate adjacency counts
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (board[r][c].mine) continue;
        let count = 0;
        forEachNeighbor(r, c, (nr, nc) => {
          if (board[nr][nc].mine) count++;
        });
        board[r][c].adjacent = count;
      }
    }

    minesPlaced = true;
  }

  function forEachNeighbor(r, c, fn) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr;
        const nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          fn(nr, nc);
        }
      }
    }
  }

  // ─── Reveal Logic ───
  function revealCell(r, c) {
    if (gameOver || gameWon) return;
    const cell = board[r][c];
    if (cell.revealed || cell.flagged) return;

    if (!minesPlaced) {
      placeMines(r, c);
      startTimer();
    }

    if (cell.mine) {
      cell.revealed = true;
      gameOver = true;
      clearInterval(timerInterval);
      smileyBtn.textContent = '😵';
      revealAllMines(r, c);
      setTimeout(() => showOverlay(false), 600);
      return;
    }

    floodReveal(r, c);
    checkWin();
  }

  function floodReveal(r, c) {
    const stack = [[r, c]];
    while (stack.length > 0) {
      const [cr, cc] = stack.pop();
      const cell = board[cr][cc];
      if (cell.revealed || cell.flagged || cell.mine) continue;

      cell.revealed = true;
      revealedCount++;
      renderCell(cr, cc);

      if (cell.adjacent === 0) {
        forEachNeighbor(cr, cc, (nr, nc) => {
          if (!board[nr][nc].revealed && !board[nr][nc].flagged) {
            stack.push([nr, nc]);
          }
        });
      }
    }
  }

  function revealAllMines(hitR, hitC) {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (board[r][c].mine) {
          board[r][c].revealed = true;
          const el = getCellEl(r, c);
          el.classList.remove('hidden');
          el.classList.add('revealed', 'mine-revealed');
          if (r === hitR && c === hitC) {
            el.classList.add('mine-hit');
          }
        }
      }
    }
  }

  // ─── Flag Logic ───
  function toggleFlag(r, c) {
    if (gameOver || gameWon) return;
    const cell = board[r][c];
    if (cell.revealed) return;

    if (cell.flagged) {
      cell.flagged = false;
      flagCount--;
    } else {
      cell.flagged = true;
      flagCount++;
    }

    mineCountEl.textContent = totalMines - flagCount;
    renderCell(r, c);
  }

  // ─── Win Check ───
  function checkWin() {
    const totalSafe = rows * cols - totalMines;
    if (revealedCount >= totalSafe) {
      gameWon = true;
      clearInterval(timerInterval);
      smileyBtn.textContent = '😎';

      // Auto-flag remaining mines
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c].mine && !board[r][c].flagged) {
            board[r][c].flagged = true;
            flagCount++;
            renderCell(r, c);
          }
        }
      }
      mineCountEl.textContent = 0;

      setTimeout(() => showOverlay(true), 400);
    }
  }

  // ─── Render ───
  function renderCell(r, c) {
    const cell = board[r][c];
    const el = getCellEl(r, c);

    el.className = 'cell';

    if (cell.revealed) {
      el.classList.add('revealed');
      if (cell.mine) {
        el.classList.add('mine-revealed');
      } else if (cell.adjacent > 0) {
        el.classList.add('n' + cell.adjacent);
        el.textContent = cell.adjacent;
      } else {
        el.textContent = '';
      }
    } else {
      el.classList.add('hidden');
      el.textContent = '';
      if (cell.flagged) {
        el.classList.add('flagged');
      }
    }
  }

  function getCellEl(r, c) {
    return gridEl.children[r * cols + c];
  }

  // ─── Timer ───
  function startTimer() {
    if (timerInterval) return;
    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = seconds;
    }, 1000);
  }

  // ─── Overlay ───
  function showOverlay(won) {
    if (won) {
      overlayEmoji.textContent = '🎉';
      overlayTitle.textContent = '恭喜通关！';
      overlaySub.textContent = `用时 ${seconds} 秒`;

      const bestKey = 'minesweeper_best_' + currentLevel;
      const prevBest = localStorage.getItem(bestKey);
      if (!prevBest || seconds < parseInt(prevBest, 10)) {
        localStorage.setItem(bestKey, seconds);
        bestRecordEl.textContent = `🏆 新纪录！`;
      } else {
        bestRecordEl.textContent = `最佳纪录：${prevBest} 秒`;
      }
    } else {
      overlayEmoji.textContent = '💥';
      overlayTitle.textContent = '游戏结束';
      overlaySub.textContent = `坚持了 ${seconds} 秒`;
      bestRecordEl.textContent = '';
    }

    if (window.GameStats) GameStats.record('minesweeper', won ? 1 : 0);
    overlay.classList.add('visible');
  }

  // ─── Event Handlers ───

  // Click handling
  gridEl.addEventListener('click', (e) => {
    const el = e.target.closest('.cell');
    if (!el) return;
    const r = parseInt(el.dataset.r);
    const c = parseInt(el.dataset.c);

    if (flagMode) {
      toggleFlag(r, c);
    } else {
      revealCell(r, c);
    }
  });

  // Right click = flag
  gridEl.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const el = e.target.closest('.cell');
    if (!el) return;
    const r = parseInt(el.dataset.r);
    const c = parseInt(el.dataset.c);
    toggleFlag(r, c);
  });

  // Long press for mobile flag
  let longPressTimer = null;
  let longPressTriggered = false;

  gridEl.addEventListener('touchstart', (e) => {
    const el = e.target.closest('.cell');
    if (!el) return;
    longPressTriggered = false;
    longPressTimer = setTimeout(() => {
      longPressTriggered = true;
      const r = parseInt(el.dataset.r);
      const c = parseInt(el.dataset.c);
      toggleFlag(r, c);
    }, 500);
  }, { passive: true });

  gridEl.addEventListener('touchend', (e) => {
    clearTimeout(longPressTimer);
    if (longPressTriggered) {
      e.preventDefault();
    }
  });

  gridEl.addEventListener('touchmove', () => {
    clearTimeout(longPressTimer);
  }, { passive: true });

  // Smiley restart
  smileyBtn.addEventListener('click', () => init());

  // Overlay restart
  overlayBtn.addEventListener('click', () => init());

  // Difficulty buttons
  diffBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      diffBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      init(btn.dataset.level);
    });
  });

  // Flag mode toggle
  flagToggleBtn.addEventListener('click', () => {
    flagMode = !flagMode;
    flagToggleBtn.classList.toggle('active', flagMode);
  });

  // ─── Start ───
  init('beginner');
})();
</script>
</body>
</html>
