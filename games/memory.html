<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆翻牌</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg-deep:#0f1220;
  --bg-surface:#161a2e;
  --card-back-start:#1e2340;
  --card-back-end:#2d3466;
  --card-front:#f0ece2;
  --card-front-hover:#f7f4ed;
  --accent-green:#4ade80;
  --accent-green-dim:rgba(74,222,128,.15);
  --accent-green-glow:rgba(74,222,128,.35);
  --text-primary:#e2e8f0;
  --text-muted:#64748b;
  --text-dim:#475569;
  --overlay-bg:rgba(10,12,24,.88);
  --radius-card:12px;
  --radius-btn:8px;
  --font-stack:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --transition-flip:0.55s cubic-bezier(.4,.0,.2,1);
  --transition-hover:0.25s ease;
}

html{height:100%}

body{
  font-family:var(--font-stack);
  background:var(--bg-deep);
  color:var(--text-primary);
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ─── Container ─── */
.container{
  width:100%;
  max-width:520px;
  padding:24px 16px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

/* ─── Header ─── */
.header{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.back-link{
  color:var(--text-muted);
  text-decoration:none;
  font-size:14px;
  letter-spacing:.02em;
  transition:color var(--transition-hover);
  white-space:nowrap;
  flex-shrink:0;
}
.back-link:hover{color:var(--text-primary)}
.back-link:focus-visible{outline:2px solid var(--accent-green);outline-offset:2px;border-radius:4px}

.title{
  font-size:22px;
  font-weight:700;
  letter-spacing:.06em;
  color:var(--text-primary);
  text-align:center;
}

/* ─── Stats Bar ─── */
.stats-bar{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
  padding:10px 0;
}

.stat{
  display:flex;
  align-items:baseline;
  gap:6px;
  font-size:14px;
  color:var(--text-muted);
}
.stat-label{font-weight:400}
.stat-value{
  font-size:20px;
  font-weight:700;
  color:var(--text-primary);
  font-variant-numeric:tabular-nums;
  min-width:28px;
  text-align:right;
}

.stat-divider{
  width:1px;
  height:20px;
  background:var(--text-dim);
  opacity:.4;
}

/* ─── Grid ─── */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  width:min(90vw,420px);
  perspective:1200px;
}

/* ─── Card ─── */
.card{
  aspect-ratio:1/1;
  position:relative;
  cursor:pointer;
  transform-style:preserve-3d;
  transition:transform var(--transition-flip);
  border-radius:var(--radius-card);
  will-change:transform;
}

.card:hover:not(.flipped):not(.matched){
  transform:translateY(-4px);
}
.card:hover:not(.flipped):not(.matched) .card-back{
  box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 1px rgba(74,222,128,.12);
}

.card.flipped{
  transform:rotateY(180deg);
}

.card.matched{
  transform:rotateY(180deg);
  cursor:default;
}
.card.matched .card-front{
  box-shadow:0 0 0 2px var(--accent-green),0 0 20px var(--accent-green-glow);
}

/* Card faces */
.card-face{
  position:absolute;
  inset:0;
  border-radius:var(--radius-card);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* Back face (visible by default) */
.card-back{
  background:linear-gradient(145deg,var(--card-back-start),var(--card-back-end));
  box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06);
  transition:box-shadow var(--transition-hover);
}

/* Art Deco diamond pattern on card back */
.card-back::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:var(--radius-card);
  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 8px,
      rgba(255,255,255,.03) 8px,
      rgba(255,255,255,.03) 9px
    ),
    repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 8px,
      rgba(255,255,255,.03) 8px,
      rgba(255,255,255,.03) 9px
    );
  pointer-events:none;
}

.card-back-icon{
  font-size:clamp(20px,5vw,28px);
  opacity:.35;
  filter:grayscale(.3);
  user-select:none;
  position:relative;
  z-index:1;
}

/* Front face (visible when flipped) */
.card-front{
  background:var(--card-front);
  transform:rotateY(180deg);
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  transition:box-shadow 0.3s ease;
}

.card-emoji{
  font-size:clamp(28px,8vw,44px);
  user-select:none;
  line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.1));
}

/* ─── Controls ─── */
.controls{
  display:flex;
  align-items:center;
  gap:16px;
}

.btn-restart{
  background:transparent;
  color:var(--text-muted);
  border:1px solid var(--text-dim);
  padding:8px 20px;
  border-radius:var(--radius-btn);
  font-family:var(--font-stack);
  font-size:14px;
  cursor:pointer;
  transition:all var(--transition-hover);
  letter-spacing:.03em;
}
.btn-restart:hover{
  color:var(--text-primary);
  border-color:var(--text-muted);
  background:rgba(255,255,255,.04);
}
.btn-restart:focus-visible{
  outline:2px solid var(--accent-green);
  outline-offset:2px;
}

.best-score{
  font-size:13px;
  color:var(--text-dim);
  letter-spacing:.02em;
}
.best-score span{
  color:var(--accent-green);
  font-weight:600;
}

/* ─── Victory Overlay ─── */
.overlay{
  position:fixed;
  inset:0;
  background:var(--overlay-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  opacity:0;
  visibility:hidden;
  transition:opacity .4s ease,visibility .4s ease;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.overlay.visible{
  opacity:1;
  visibility:visible;
}

.overlay-content{
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  padding:40px 48px;
  background:var(--bg-surface);
  border:1px solid rgba(255,255,255,.06);
  border-radius:20px;
  box-shadow:0 24px 80px rgba(0,0,0,.5);
  transform:scale(.92);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
}
.overlay.visible .overlay-content{
  transform:scale(1);
}

.overlay-emoji{
  font-size:48px;
  line-height:1;
}

.overlay-title{
  font-size:24px;
  font-weight:700;
  letter-spacing:.04em;
}

.overlay-stats{
  display:flex;
  gap:32px;
  font-size:15px;
  color:var(--text-muted);
}
.overlay-stats strong{
  color:var(--text-primary);
  font-weight:700;
  font-size:18px;
  font-variant-numeric:tabular-nums;
}

.overlay-best{
  font-size:13px;
  color:var(--text-dim);
}
.overlay-best span{
  color:var(--accent-green);
  font-weight:600;
}

.btn-play-again{
  background:var(--accent-green);
  color:#0f1220;
  border:none;
  padding:12px 32px;
  border-radius:var(--radius-btn);
  font-family:var(--font-stack);
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  letter-spacing:.03em;
  transition:all var(--transition-hover);
  margin-top:4px;
}
.btn-play-again:hover{
  background:#6ee7a0;
  transform:translateY(-1px);
  box-shadow:0 4px 16px var(--accent-green-glow);
}
.btn-play-again:focus-visible{
  outline:2px solid var(--text-primary);
  outline-offset:3px;
}

/* ─── Card entrance animation ─── */
@keyframes cardIn{
  from{opacity:0;transform:scale(.85) translateY(12px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.card{
  animation:cardIn .35s cubic-bezier(.4,0,.2,1) both;
}

/* ─── Matched pulse ─── */
@keyframes matchPulse{
  0%{transform:rotateY(180deg) scale(1)}
  50%{transform:rotateY(180deg) scale(1.06)}
  100%{transform:rotateY(180deg) scale(1)}
}
.card.match-anim{
  animation:matchPulse .35s ease;
}

/* ─── Reduced motion ─── */
@media(prefers-reduced-motion:reduce){
  .card{animation:none;transition:transform .01s}
  .overlay,.overlay-content{transition:none}
  .card-back,.card-front,.btn-play-again{transition:none}
}

/* ─── Small screens ─── */
@media(max-width:380px){
  .grid{gap:7px}
  .stats-bar{gap:16px}
  .title{font-size:18px}
  .overlay-content{padding:28px 24px}
}
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <a href="../index.html" class="back-link">← 返回</a>
    <h1 class="title">记忆翻牌</h1>
    <div style="width:52px"></div>
  </header>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-label">步数</span>
      <span class="stat-value" id="steps">0</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-label">用时</span>
      <span class="stat-value" id="timer">0</span>
      <span class="stat-label">秒</span>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="controls">
    <button class="btn-restart" id="restart">重新开始</button>
    <div class="best-score">最佳 <span id="best">-</span> 步</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-content">
    <div class="overlay-emoji">🎉</div>
    <div class="overlay-title">恭喜通关</div>
    <div class="overlay-stats">
      <div>用时 <strong id="final-time">0</strong> 秒</div>
      <div>步数 <strong id="final-steps">0</strong></div>
    </div>
    <div class="overlay-best" id="overlay-best"></div>
    <button class="btn-play-again" id="overlay-restart">再来一局</button>
  </div>
</div>

<script src="../js/game-stats.js"></script>
<script>
(function(){
  "use strict";

  /* ─── Config ─── */
  const EMOJIS = ["🍎","🍌","🍇","🍓","🍉","🍒","🥝","🍑"];
  const FLIP_BACK_DELAY = 800;
  const STORAGE_KEY = "memory_best";

  /* ─── State ─── */
  let cards = [];
  let flippedIndices = [];
  let matchedCount = 0;
  let steps = 0;
  let seconds = 0;
  let timerInterval = null;
  let locked = false;
  let gameStarted = false;

  /* ─── DOM refs ─── */
  const grid = document.getElementById("grid");
  const stepsEl = document.getElementById("steps");
  const timerEl = document.getElementById("timer");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const finalTimeEl = document.getElementById("final-time");
  const finalStepsEl = document.getElementById("final-steps");
  const overlayBestEl = document.getElementById("overlay-best");
  const restartBtn = document.getElementById("restart");
  const overlayRestartBtn = document.getElementById("overlay-restart");

  /* ─── Utilities ─── */
  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function getBest(){
    try{
      const v = localStorage.getItem(STORAGE_KEY);
      return v ? parseInt(v, 10) : null;
    }catch(e){ return null; }
  }

  function setBest(val){
    try{ localStorage.setItem(STORAGE_KEY, String(val)); }catch(e){}
  }

  function formatBest(val){
    return val !== null ? val : "-";
  }

  /* ─── Timer ─── */
  function startTimer(){
    if(timerInterval) return;
    timerInterval = setInterval(function(){
      seconds++;
      timerEl.textContent = seconds;
    }, 1000);
  }

  function stopTimer(){
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function resetTimer(){
    stopTimer();
    seconds = 0;
    timerEl.textContent = "0";
  }

  /* ─── Render ─── */
  function buildDeck(){
    const pairs = EMOJIS.concat(EMOJIS);
    shuffle(pairs);
    return pairs;
  }

  function renderGrid(){
    grid.innerHTML = "";
    cards = buildDeck();
    flippedIndices = [];
    matchedCount = 0;
    steps = 0;
    locked = false;
    gameStarted = false;
    stepsEl.textContent = "0";
    resetTimer();
    bestEl.textContent = formatBest(getBest());

    cards.forEach(function(emoji, idx){
      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = (idx * 30) + "ms";
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "卡片 " + (idx + 1));
      card.setAttribute("tabindex", "0");
      card.dataset.index = idx;

      const back = document.createElement("div");
      back.className = "card-face card-back";
      const backIcon = document.createElement("span");
      backIcon.className = "card-back-icon";
      backIcon.textContent = "❓";
      backIcon.setAttribute("aria-hidden", "true");
      back.appendChild(backIcon);

      const front = document.createElement("div");
      front.className = "card-face card-front";
      const emojiSpan = document.createElement("span");
      emojiSpan.className = "card-emoji";
      emojiSpan.textContent = emoji;
      emojiSpan.setAttribute("aria-hidden", "true");
      front.appendChild(emojiSpan);

      card.appendChild(back);
      card.appendChild(front);

      card.addEventListener("click", function(){ onCardClick(idx); });
      card.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          onCardClick(idx);
        }
      });

      grid.appendChild(card);
    });
  }

  /* ─── Game Logic ─── */
  function onCardClick(idx){
    if(locked) return;

    const cardEl = grid.children[idx];
    if(!cardEl) return;

    /* Already flipped or matched */
    if(cardEl.classList.contains("flipped") || cardEl.classList.contains("matched")) return;

    /* Start timer on first click */
    if(!gameStarted){
      gameStarted = true;
      startTimer();
    }

    /* Flip the card */
    cardEl.classList.add("flipped");
    flippedIndices.push(idx);

    /* Check pair */
    if(flippedIndices.length === 2){
      steps++;
      stepsEl.textContent = steps;
      locked = true;

      const [i1, i2] = flippedIndices;
      const el1 = grid.children[i1];
      const el2 = grid.children[i2];

      if(cards[i1] === cards[i2]){
        /* Match! */
        setTimeout(function(){
          el1.classList.add("matched", "match-anim");
          el2.classList.add("matched", "match-anim");
          matchedCount += 2;
          flippedIndices = [];
          locked = false;

          /* Remove pulse class after animation */
          setTimeout(function(){
            el1.classList.remove("match-anim");
            el2.classList.remove("match-anim");
          }, 400);

          if(matchedCount === cards.length){
            onWin();
          }
        }, 300);
      } else {
        /* No match – flip back after delay */
        setTimeout(function(){
          el1.classList.remove("flipped");
          el2.classList.remove("flipped");
          flippedIndices = [];
          locked = false;
        }, FLIP_BACK_DELAY);
      }
    }
  }

  function onWin(){
    stopTimer();

    /* Update best score */
    const prevBest = getBest();
    const isNewBest = prevBest === null || steps < prevBest;
    if(isNewBest){
      setBest(steps);
    }
    bestEl.textContent = formatBest(getBest());

    if(window.GameStats) GameStats.record('memory', 1);

    /* Show overlay */
    finalTimeEl.textContent = seconds;
    finalStepsEl.textContent = steps;
    if(isNewBest){
      overlayBestEl.innerHTML = "🏆 新纪录！";
    } else {
      overlayBestEl.innerHTML = "最佳 <span>" + formatBest(prevBest) + "</span> 步";
    }

    /* Slight delay so last match animation finishes */
    setTimeout(function(){
      overlay.classList.add("visible");
    }, 500);
  }

  function hideOverlay(){
    overlay.classList.remove("visible");
  }

  /* ─── Events ─── */
  restartBtn.addEventListener("click", function(){
    hideOverlay();
    renderGrid();
  });

  overlayRestartBtn.addEventListener("click", function(){
    hideOverlay();
    renderGrid();
  });

  /* ─── Init ─── */
  renderGrid();
})();
</script>
</body>
</html>
